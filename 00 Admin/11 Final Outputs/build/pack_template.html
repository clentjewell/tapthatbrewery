<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --keg:#0E171F; --keg-deep:#080E14; --brass:#0066FF; --brass-lt:#5B8CFF;
  --cream:#FAF8F4; --paper:#FFFFFF; --ink:#111111; --steel:#666666;
  --rule:#D4D2D0; --rule-dk:rgba(250,248,244,.16);
  --ok:#1F8A5B; --shade:#EDEBEA;
  --ease:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --keg:#141C24; --keg-deep:#080E14; --brass:#5B8CFF; --brass-lt:#8FB4FF;
    --cream:#E9E7E3; --paper:#14181C; --ink:#E9E7E3; --steel:#9AA0A6;
    --rule:rgba(233,231,227,.15); --rule-dk:rgba(233,231,227,.14);
    --ok:#4FBF8B; --shade:#191E23;
  }
}
:root[data-theme="dark"] {
  --keg:#141C24; --keg-deep:#080E14; --brass:#5B8CFF; --brass-lt:#8FB4FF;
  --cream:#E9E7E3; --paper:#14181C; --ink:#E9E7E3; --steel:#9AA0A6;
  --rule:rgba(233,231,227,.15); --rule-dk:rgba(233,231,227,.14);
  --ok:#4FBF8B; --shade:#191E23;
}

html { scroll-behavior:smooth; }
body {
  font-family:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  background:var(--cream); color:var(--ink); font-size:16px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) body{ background:#0B0F13; } }
:root[data-theme="dark"] body{ background:#0B0F13; }

.progress{position:fixed;top:0;left:0;height:2px;width:0;background:var(--brass);z-index:400;}
.layout{display:flex;align-items:flex-start;max-width:1400px;margin:0 auto;}

/* sidebar */
.sidebar{position:sticky;top:18px;align-self:flex-start;flex:0 0 268px;width:268px;
  max-height:calc(100vh - 36px);display:flex;flex-direction:column;
  margin:18px 0 18px 18px;padding:20px 12px 8px;background:var(--paper);
  border:1px solid var(--rule);border-radius:14px;}
.brand { display: flex; align-items: center; gap: 9px; margin: 2px 8px 10px; text-decoration: none; }
.brand-jp { height: 16px; width: auto; display: block; }
.brand-tt { height: 27px; width: auto; display: block; }
.brand .x { color: var(--steel); font-size: 13px; font-weight: 400; line-height: 1; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .brand-jp { filter: invert(1); } }
:root[data-theme="dark"] .brand-jp { filter: invert(1); }
.hero-badge { width: clamp(120px, 15vw, 172px); height: auto; display: block; margin-bottom: 26px; }
.brand-sub{font-family:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--steel);margin:0 8px 14px;}
.filter{width:calc(100% - 16px);margin:0 8px 10px;padding:8px 10px;border:1px solid var(--rule);
  border-radius:7px;background:var(--shade);color:var(--ink);font-family:inherit;font-size:13px;}
.filter::placeholder{color:var(--steel);}
.filter:focus{outline:none;border-color:var(--brass);}
.nav{display:flex;flex-direction:column;gap:1px;overflow-y:auto;padding-bottom:12px;}
.nav-phase{font-family:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--brass);margin:14px 10px 5px;}
.nav-link{display:flex;gap:9px;align-items:baseline;text-decoration:none;color:var(--steel);
  font-size:13px;line-height:1.3;padding:6px 10px;border-radius:6px;
  border-left:2px solid transparent;transition:color .15s,background .15s;}
.nav-num{font-family:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:10px;opacity:.7;min-width:17px;
  font-variant-numeric:tabular-nums;}
.nav-link:hover{color:var(--ink);background:rgba(0,102,255,.08);}
.nav-link:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
.nav-link.active{color:var(--ink);background:rgba(0,102,255,.12);border-left-color:var(--brass);font-weight:600;}
.nav-link.active .nav-num{color:var(--brass);opacity:1;}
.nav-link.edge{color:var(--ink);font-weight:600;}
.nav-link.hide{display:none;}
.sig{color:var(--brass);margin-left:5px;font-size:11px;}
.nav-empty{font-size:12.5px;color:var(--steel);padding:10px;display:none;}
.nav-empty.show{display:block;}

/* content */
.content{flex:1 1 auto;min-width:0;padding:34px clamp(22px,4.5vw,64px) 80px;max-width:940px;}

/* welcome */
.eyebrow{font-family:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:10.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--steel);margin-bottom:20px;}
.h-hero{font-family:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:clamp(36px,5.6vw,66px);font-weight:700;
  line-height:1.03;letter-spacing:-.032em;text-wrap:balance;}
.lead{font-size:clamp(16px,1.5vw,18.5px);line-height:1.68;color:var(--steel);max-width:60ch;margin-top:24px;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);
  border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin-top:38px;}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,1fr);}}
.stat{background:var(--paper);padding:18px 16px;}
.stat-n{font-family:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:28px;font-weight:700;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;}
.stat-l{font-family:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--steel);margin-top:4px;}
.callout{background:var(--keg);color:var(--cream);border-radius:14px;padding:clamp(26px,4vw,40px);margin-top:34px;}
.callout .k{font-family:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--brass-lt);}
.callout .q{font-family:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:clamp(19px,2.4vw,27px);font-weight:600;
  line-height:1.34;letter-spacing:-.02em;margin-top:14px;max-width:26ch;text-wrap:balance;}
.callout .b{font-size:15px;line-height:1.7;color:rgba(250,248,244,.75);margin-top:16px;max-width:62ch;}
.callout a{color:var(--brass-lt);}
.note{font-size:13px;line-height:1.6;color:var(--steel);margin-top:22px;}

/* doc */
.doc{padding-top:2px;}
.doc-head{display:flex;align-items:center;justify-content:space-between;gap:14px;
  flex-wrap:wrap;margin-bottom:18px;}
.doc-head-l{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.doc-chip{font-family:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:10px;font-weight:500;letter-spacing:.12em;
  text-transform:uppercase;color:var(--brass);}
.doc-count{font-family:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:10px;letter-spacing:.06em;
  color:var(--steel);font-variant-numeric:tabular-nums;}
.pill{font-family:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:9px;font-weight:500;letter-spacing:.1em;
  text-transform:uppercase;padding:2px 7px;border-radius:3px;border:1px solid;white-space:nowrap;}
.pill.draft{color:var(--steel);border-color:var(--rule);}
.pill.sign{color:var(--brass);border-color:rgba(0,102,255,.45);background:rgba(0,102,255,.09);}
.doc-title{font-family:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:clamp(27px,3.6vw,42px);font-weight:700;
  line-height:1.08;letter-spacing:-.028em;text-wrap:balance;}

/* prose */
.prose{margin-top:26px;font-size:16px;line-height:1.75;}
.prose > * + *{margin-top:16px;}
.prose h3{font-family:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:clamp(19px,2.1vw,25px);font-weight:700;
  line-height:1.25;letter-spacing:-.02em;margin-top:44px;padding-top:20px;
  border-top:1px solid var(--rule);text-wrap:balance;}
.prose h4{font-family:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:17px;font-weight:700;line-height:1.35;
  margin-top:30px;letter-spacing:-.01em;}
.prose h5,.prose h6{font-family:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:15px;font-weight:600;margin-top:24px;}
.prose p{max-width:70ch;}
.prose strong{font-weight:700;}
.prose em{font-style:italic;color:var(--steel);}
.prose a{color:var(--brass);}
.prose ul,.prose ol{padding-left:22px;max-width:70ch;}
.prose li{margin-top:7px;}
.prose li::marker{color:var(--brass);}
.prose hr{border:0;height:1px;background:var(--rule);margin:34px 0;}
.prose blockquote{border-left:3px solid var(--brass);padding:2px 0 2px 20px;color:var(--ink);
  font-family:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:19px;font-weight:600;line-height:1.45;letter-spacing:-.015em;}
.prose code{font-family:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:.88em;background:var(--shade);
  padding:2px 5px;border-radius:3px;}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--rule);
  border-radius:9px;background:var(--paper);}
.prose table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.55;}
.prose th{font-family:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--steel);text-align:left;font-weight:500;
  padding:11px 14px;border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--shade);}
.prose td{padding:11px 14px;border-bottom:1px solid var(--rule);vertical-align:top;}
.prose tr:last-child td{border-bottom:0;}
.prose td:first-child{font-weight:600;}
.prose table strong{font-weight:700;}


/* sidebar button — sits outside .nav so it stays visible when the
   contents are collapsed on mobile */
.btn-side{display:flex;align-items:center;gap:8px;width:calc(100% - 16px);margin:0 8px 12px;
  padding:10px 11px;border-radius:8px;text-decoration:none;background:var(--keg);
  color:var(--cream);
  font-family:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  font-size:12.5px;font-weight:600;transition:background .15s,color .15s;}
.btn-side:hover{background:var(--brass);color:#fff;}
.btn-side:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
.btn-side .ic{font-size:13px;line-height:1;flex:none;}

/* landing contents */
.ph{margin-top:52px;}
.ph-h{display:flex;align-items:baseline;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--rule);}
.ph-n{font-family:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--brass);font-weight:600;}
.ph-c{font-family:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:10px;letter-spacing:.06em;color:var(--steel);
  margin-left:auto;font-variant-numeric:tabular-nums;}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule);border-top:0;border-radius:0 0 10px 10px;overflow:hidden;}
.card{background:var(--paper);padding:14px 15px;text-decoration:none;color:inherit;display:flex;
  flex-direction:column;gap:5px;transition:background .15s;min-height:78px;}
.card:hover{background:rgba(0,102,255,.06);}
.card:focus-visible{outline:2px solid var(--brass);outline-offset:-2px;}
.card-n{font-family:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:10px;letter-spacing:.06em;color:var(--steel);
  font-variant-numeric:tabular-nums;}
.card-t{font-family:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:14.5px;font-weight:600;line-height:1.28;
  letter-spacing:-.012em;}
.card-s{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);margin-top:auto;}

/* doc nav */
.doc-nav{display:flex;justify-content:space-between;gap:14px;margin-top:44px;padding-top:22px;
  border-top:1px solid var(--rule);}
.dn-sp{flex:1;}
.dn-btn{flex:0 1 46%;text-decoration:none;color:inherit;padding:13px 15px;border:1px solid var(--rule);
  border-radius:9px;display:flex;flex-direction:column;gap:3px;transition:border-color .15s,background .15s;}
.dn-btn:hover{border-color:var(--brass);background:rgba(0,102,255,.05);}
.dn-btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
.dn-btn.next{text-align:right;margin-left:auto;}
.dn-btn span{font-family:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--steel);}
.dn-btn strong{font-family:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:14.5px;font-weight:600;line-height:1.3;}

/* to top */
.totop{position:fixed;right:20px;bottom:20px;width:42px;height:42px;border-radius:50%;
  background:var(--keg);color:var(--cream);border:0;cursor:pointer;font-size:16px;
  display:none;place-items:center;z-index:300;box-shadow:0 4px 16px rgba(0,0,0,.18);}
.totop.show{display:grid;}
.totop:focus-visible{outline:2px solid var(--brass);outline-offset:3px;}

@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto;} }

/* mobile */
.navtoggle{display:none;}
@media (max-width:1000px){
  .layout{display:block;}
  .sidebar{position:static;width:auto;max-height:none;margin:12px;padding:16px;}
  .nav,.filter{display:none;}
  .sidebar.open .nav{display:flex;max-height:60vh;}
  .sidebar.open .filter{display:block;}
  .navtoggle{display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;
    font-family:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--brass);padding:6px 8px;}
  .content{padding:8px 20px 60px;}
  .dn-btn{flex:0 1 48%;}
}
</style>
</head>
<body>
<div class="progress" id="prog"></div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="/">
      <img class="brand-jp" src="/brand/jewell-wordmark.png" alt="Jewell Projects">
      <span class="x">&times;</span>
      <img class="brand-tt" src="/brand/tapthat-icon.png" alt="Tap That Brewery">
    </a>
    <div class="brand-sub">Complete 3D Process · {{TOTAL}} documents</div>
    <a class="btn-side" href="/summary"><span class="ic">&larr;</span>Delivery summary</a>
    <button class="navtoggle" id="navtoggle" aria-expanded="false">Contents +</button>
    <input class="filter" id="filter" type="search" placeholder="Filter documents…" aria-label="Filter documents">
    <nav class="nav" id="nav">
{{NAV}}
      <p class="nav-empty" id="navempty">No document matches that.</p>
    </nav>
  </aside>

  <main class="content">
{{MAIN}}
  </main>
</div>

<button class="totop" id="totop" aria-label="Back to top">Top</button>

<script>
(function () {
  var prog = document.getElementById('prog');
  var totop = document.getElementById('totop');
  var links = Array.prototype.slice.call(document.querySelectorAll('.nav-link'));
  var navEl = document.getElementById('nav');

  // Bring the current page's nav entry into view — the list is 78 long.
  var cur = navEl.querySelector('.nav-link.active');
  if (cur && navEl.scrollHeight > navEl.clientHeight) {
    navEl.scrollTop = cur.offsetTop - navEl.clientHeight / 2 + cur.offsetHeight / 2;
  }

  function onScroll() {
    var h = document.documentElement.scrollHeight - window.innerHeight;
    prog.style.width = (h > 0 ? (window.scrollY / h) * 100 : 0) + '%';
    totop.classList.toggle('show', window.scrollY > 900);
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  totop.addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  });

  var filter = document.getElementById('filter');
  var empty = document.getElementById('navempty');
  if (filter) {
    filter.addEventListener('input', function () {
      var q = filter.value.trim().toLowerCase();
      var shown = 0;
      links.forEach(function (l) {
        if (l.classList.contains('edge')) return;
        var t = l.getAttribute('data-t') || '';
        var num = (l.querySelector('.nav-num') || {}).textContent || '';
        var hit = !q || t.indexOf(q) !== -1 || num.indexOf(q) !== -1;
        l.classList.toggle('hide', !hit);
        if (hit) shown++;
      });
      document.querySelectorAll('.nav-phase').forEach(function (p) {
        var any = false, n = p.nextElementSibling;
        while (n && !n.classList.contains('nav-phase')) {
          if (n.classList.contains('nav-link') && !n.classList.contains('hide')) { any = true; break; }
          n = n.nextElementSibling;
        }
        p.style.display = any ? '' : 'none';
      });
      empty.classList.toggle('show', shown === 0);
    });
  }

  var tog = document.getElementById('navtoggle'), sb = document.getElementById('sidebar');
  if (tog) {
    tog.addEventListener('click', function () {
      var open = sb.classList.toggle('open');
      tog.setAttribute('aria-expanded', open ? 'true' : 'false');
      tog.textContent = open ? 'Contents −' : 'Contents +';
    });
    navEl.addEventListener('click', function (e) {
      if (e.target.closest('.nav-link') && window.innerWidth <= 1000) {
        sb.classList.remove('open');
        tog.setAttribute('aria-expanded', 'false');
        tog.textContent = 'Contents +';
      }
    });
  }
})();
</script>
</body>
</html>
